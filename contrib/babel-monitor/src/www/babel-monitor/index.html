<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>babel-monitor</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #23282f;
    --fg: #e6e8eb;
    --muted: #9aa3ad;
    --line: #3a424d;
    --accent: #5b9fd4;
    --ok: #6fbf73;
    --bad: #d97b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: baseline;
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 14px 18px 28px; max-width: 1100px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 110px;
  }
  .kpi .v { font-size: 1.25rem; font-weight: 600; }
  .kpi .l { color: var(--muted); font-size: 11px; margin-top: 2px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 14px;
  }
  section h2 { margin: 0 0 10px; font-size: 0.95rem; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tabs.metric { margin-bottom: 10px; }
  .tabs.time { margin-top: 10px; }
  .tabs button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .tabs button.active { color: var(--fg); border-color: var(--accent); }
  .chart-wrap { position: relative; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin: 0 0 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i {
    display: inline-block;
    width: 12px;
    height: 3px;
    border-radius: 1px;
  }
  canvas { width: 100%; height: 180px; display: block; background: #15181c; border-radius: 4px; cursor: crosshair; }
  .chart-tip {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    display: none;
    min-width: 140px;
    max-width: 280px;
    padding: 8px 10px;
    background: rgba(20, 23, 28, 0.94);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    font-size: 12px;
    color: var(--fg);
    line-height: 1.35;
  }
  .chart-tip .t { color: var(--muted); margin-bottom: 6px; font-size: 11px; }
  .chart-tip .tip-row {
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    gap: 12px;
    margin: 2px 0;
  }
  .chart-tip .tip-row .n {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chart-tip .tip-row .n i {
    flex: 0 0 auto;
    width: 10px;
    height: 3px;
    border-radius: 1px;
  }
  .chart-tip .tip-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .err { color: var(--bad); padding: 12px 18px; }
</style>
</head>
<body>
<header>
  <h1>babel-monitor</h1>
  <div class="meta" id="identity">connecting…</div>
</header>
<div class="err" id="err" hidden></div>
<main>
  <div class="row" id="kpis"></div>
  <section>
    <h2>History</h2>
    <div class="tabs metric" id="metricTabs" role="tablist" aria-label="Metric">
      <button type="button" data-metric="lq" class="active">LQ</button>
      <button type="button" data-metric="cost">Cost</button>
      <button type="button" data-metric="neighbors">Neighbors</button>
      <button type="button" data-metric="routes">Routes</button>
      <button type="button" data-metric="links">Links</button>
      <button type="button" data-metric="hosts">Hosts</button>
      <button type="button" data-metric="cpu">CPU</button>
      <button type="button" data-metric="ram">RAM</button>
      <button type="button" data-metric="rf">RF</button>
    </div>
    <div class="chart-wrap">
      <div class="legend" id="legend"></div>
      <canvas id="chart" width="1000" height="180"></canvas>
      <div class="chart-tip" id="chartTip" hidden></div>
    </div>
    <div class="tabs time" id="timeTabs" role="tablist" aria-label="Time range">
      <button type="button" data-sec="300" class="active">5m</button>
      <button type="button" data-sec="1800">30m</button>
      <button type="button" data-sec="86400">24h</button>
    </div>
  </section>
  <section>
    <h2>Neighbors (live)</h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>IPv6</th><th>Iface</th><th>LQ</th><th>Cost</th><th>Rx</th><th>Tx</th></tr>
        </thead>
        <tbody id="neigh"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(function () {
  const API = "/cgi-bin/babel-monitor";
  const PALETTE = ["#5b9fd4", "#e0a458", "#6fbf73", "#d97b7b", "#b39ddb"];

  const METRICS = {
    lq: {
      label: "LQ",
      series: [
        { key: "mean_lq", label: "mean LQ %", color: PALETTE[0] },
        { key: "min_lq", label: "min LQ %", color: PALETTE[1] }
      ],
      minY: 0,
      maxY: 100
    },
    cost: {
      label: "Cost",
      series: [
        { key: "mean_cost", label: "mean cost", color: PALETTE[0] },
        { key: "bad_cost_count", label: "bad cost #", color: PALETTE[3] }
      ]
    },
    neighbors: {
      label: "Neighbors",
      series: [
        { key: "neighbor_count", label: "neighbors", color: PALETTE[0] },
        { key: "routable_count", label: "routable", color: PALETTE[2] }
      ],
      minY: 0
    },
    routes: {
      label: "Routes",
      series: [
        { key: "route_count_20", label: "/20", color: PALETTE[0] },
        { key: "route_count_21", label: "/21", color: PALETTE[1] },
        { key: "route_count_22", label: "/22", color: PALETTE[2] }
      ],
      minY: 0
    },
    links: {
      label: "Links",
      series: [
        { key: "tx_packets_delta", label: "TX Δ", color: PALETTE[0] },
        { key: "tx_retries_delta", label: "retry Δ", color: PALETTE[1] },
        { key: "tx_fail_delta", label: "fail Δ", color: PALETTE[3] }
      ],
      minY: 0
    },
    hosts: {
      label: "Hosts",
      series: [
        { key: "host_count", label: "hosts", color: PALETTE[0] },
        { key: "host_change_delta", label: "change Δ", color: PALETTE[1] }
      ],
      minY: 0
    },
    cpu: {
      label: "CPU",
      series: [
        { key: "cpu_pct", label: "CPU %", color: PALETTE[0] },
        { key: "cpu_peak_pct", label: "peak %", color: PALETTE[3] }
      ],
      minY: 0,
      maxY: 100
    },
    ram: {
      label: "RAM",
      series: [
        { key: "mem_used_pct", label: "used %", color: PALETTE[0] }
      ],
      minY: 0,
      maxY: 100
    },
    rf: {
      label: "RF",
      /* series filled dynamically: AVG + each unique RF neighbor SNR */
      series: [],
      minY: 0,
      dynamic: "rf"
    }
  };

  let windowSec = 300;
  let metricId = "lq";
  let series = [];
  let hoverIdx = -1;
  let chartLayout = null; /* { padL, padR, padT, padB, plotW, n } */

  function $(id) { return document.getElementById(id); }

  function formatTime(t) {
    if (t == null) return "—";
    const d = new Date(Number(t) * 1000);
    if (isNaN(d.getTime())) return String(t);
    const p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function formatVal(v) {
    if (v == null || v !== v) return "—";
    if (Math.abs(v - Math.round(v)) < 1e-6) return String(Math.round(v));
    return (Math.round(v * 10) / 10).toString();
  }

  function colorAt(i) {
    return PALETTE[i % PALETTE.length];
  }

  function resolveMetric() {
    const base = METRICS[metricId] || METRICS.lq;
    if (base.dynamic !== "rf") {
      return base;
    }
    const keys = {};
    for (let i = 0; i < series.length; i++) {
      const rf = series[i].rf;
      if (!rf) continue;
      for (const k in rf) {
        if (Object.prototype.hasOwnProperty.call(rf, k)) keys[k] = true;
      }
    }
    const names = Object.keys(keys).sort();
    const out = [
      { key: "mean_snr", label: "AVG", color: "#e6e8eb", width: 2.5 }
    ];
    for (let i = 0; i < names.length; i++) {
      out.push({
        key: names[i],
        label: names[i],
        color: colorAt(i),
        width: 1.4,
        fromRf: true
      });
    }
    return { label: "RF", series: out, minY: 0 };
  }

  function sampleValue(row, spec) {
    if (spec.fromRf) {
      if (!row.rf) return null;
      const v = row.rf[spec.key];
      return v == null ? null : Number(v);
    }
    const v = row[spec.key];
    return v == null ? null : Number(v);
  }

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function setErr(msg) {
    const el = $("err");
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = msg;
  }

  function renderKpis(live) {
    const m = live.meta || {};
    const s = live.latest || {};
    $("identity").textContent =
      (m.hostname || "?") + " · " + (m.node_id || "?") +
      " · boot " + (m.boot_id || "?") +
      " · " + (m.package_version || "");
    const items = [
      ["Neighbors", s.neighbor_count ?? "—"],
      ["Routable", s.routable_count ?? "—"],
      ["Mean LQ", s.mean_lq != null ? s.mean_lq + "%" : "—"],
      ["Mean cost", s.mean_cost ?? "—"],
      ["TX Δ", s.tx_packets_delta ?? "—"],
      ["Retry Δ", s.tx_retries_delta ?? "—"],
      ["Fail Δ", s.tx_fail_delta ?? "—"],
      ["CPU", s.cpu_pct != null ? s.cpu_pct + "%" : "—"],
      ["CPU peak", s.cpu_peak_pct != null ? s.cpu_peak_pct + "%" : "—"],
      ["RAM used", s.mem_used_pct != null ? s.mem_used_pct + "%" : "—"],
      ["Uptime", s.uptime_s != null ? s.uptime_s + "s" : "—"],
      ["Hosts", s.host_count ?? "—"],
      ["Samples", (m.sample_count ?? 0) + "/" + (m.sample_cap ?? 0)],
      ["LQM", s.lqm_ok ? "ok" : "—"],
      ["Babel", s.babel_ok ? "ok" : "—"]
    ];
    $("kpis").innerHTML = items.map(function (it) {
      return '<div class="kpi"><div class="v">' + it[1] + '</div><div class="l">' + it[0] + '</div></div>';
    }).join("");
  }

  function renderNeigh(list) {
    const tb = $("neigh");
    if (!list || !list.length) {
      tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">No neighbors</td></tr>';
      return;
    }
    tb.innerHTML = list.map(function (n) {
      return "<tr><td>" + n.ipv6 + "</td><td>" + n.iface + "</td><td>" + n.lq +
        "%</td><td>" + n.cost + "</td><td>" + n.rxcost + "</td><td>" + n.txcost + "</td></tr>";
    }).join("");
  }

  function renderLegend(metric) {
    $("legend").innerHTML = metric.series.map(function (s) {
      return '<span><i style="background:' + s.color + '"></i>' + s.label + "</span>";
    }).join("");
  }

  function yBounds(metric, lines) {
    let lo = metric.minY != null ? metric.minY : Infinity;
    let hi = metric.maxY != null ? metric.maxY : -Infinity;
    if (metric.minY == null || metric.maxY == null) {
      for (let li = 0; li < lines.length; li++) {
        const vals = lines[li];
        for (let i = 0; i < vals.length; i++) {
          const v = vals[i];
          if (v == null || v !== v) continue;
          if (metric.minY == null && v < lo) lo = v;
          if (metric.maxY == null && v > hi) hi = v;
        }
      }
    }
    if (!isFinite(lo)) lo = 0;
    if (!isFinite(hi) || hi <= lo) hi = lo + 1;
    if (metric.minY != null) lo = metric.minY;
    if (metric.maxY != null) hi = Math.max(metric.maxY, hi);
    return { lo: lo, hi: hi };
  }

  function hideTip() {
    const tip = $("chartTip");
    tip.style.display = "none";
    tip.hidden = true;
  }

  function showTip(metric, idx, clientX, clientY) {
    const tip = $("chartTip");
    const wrap = tip.parentElement;
    const row = series[idx];
    if (!row) { hideTip(); return; }

    let html = '<div class="t">' + formatTime(row.t) +
      (row.seq != null ? " · seq " + row.seq : "") + "</div>";
    for (let si = 0; si < metric.series.length; si++) {
      const spec = metric.series[si];
      const v = sampleValue(row, spec);
      html += '<div class="tip-row"><span class="n"><i style="background:' +
        spec.color + '"></i>' + spec.label + '</span><span class="v">' +
        formatVal(v) + "</span></div>";
    }
    tip.innerHTML = html;
    tip.hidden = false;
    tip.style.display = "block";

    const wr = wrap.getBoundingClientRect();
    const tw = tip.offsetWidth || 160;
    const th = tip.offsetHeight || 80;
    let left = clientX - wr.left + 14;
    let top = clientY - wr.top - th - 10;
    if (left + tw > wr.width - 4) left = clientX - wr.left - tw - 14;
    if (left < 4) left = 4;
    if (top < 4) top = clientY - wr.top + 16;
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  function indexFromCanvasX(cssX, cssW) {
    if (!chartLayout || !series.length) return -1;
    const scaleX = $("chart").width / Math.max(1, cssW);
    const x = cssX * scaleX;
    const { padL, plotW, n } = chartLayout;
    if (x < padL || x > padL + plotW) return -1;
    if (n <= 1) return 0;
    const t = (x - padL) / plotW;
    let idx = Math.round(t * (n - 1));
    if (idx < 0) idx = 0;
    if (idx > n - 1) idx = n - 1;
    return idx;
  }

  function drawChart() {
    const metric = resolveMetric();
    renderLegend(metric);
    const c = $("chart");
    const ctx = c.getContext("2d");
    const w = c.width, h = c.height;
    const padL = 44, padR = 12, padT = 14, padB = 22;
    const plotW = w - padL - padR;
    chartLayout = { padL: padL, padR: padR, padT: padT, padB: padB, plotW: plotW, n: series.length };
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#3a424d";
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, h - padB);
    ctx.lineTo(w - padR, h - padB);
    ctx.stroke();

    if (!series.length) {
      ctx.fillStyle = "#9aa3ad";
      ctx.fillText("No samples in window", padL + 10, h / 2);
      hideTip();
      return;
    }

    if (metricId === "rf") {
      const anyRf = series.some(function (s) {
        return (s.rf && Object.keys(s.rf).length) || (s.mean_snr != null && s.mean_snr > 0);
      });
      if (!anyRf) {
        ctx.fillStyle = "#9aa3ad";
        ctx.fillText("No RF neighbors in window", padL + 10, h / 2);
        hideTip();
        return;
      }
    }

    const lines = metric.series.map(function (s) {
      return series.map(function (row) { return sampleValue(row, s); });
    });
    const bounds = yBounds(metric, lines);
    const span = bounds.hi - bounds.lo;

    ctx.fillStyle = "#9aa3ad";
    ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText(String(bounds.hi), 4, padT + 8);
    ctx.fillText(String(bounds.lo), 4, h - padB);

    const n = series.length;
    for (let si = 0; si < metric.series.length; si++) {
      const spec = metric.series[si];
      const vals = lines[si];
      ctx.strokeStyle = spec.color;
      ctx.lineWidth = spec.width || 1.5;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i < n; i++) {
        const v = vals[i];
        if (v == null || v !== v) {
          started = false;
          continue;
        }
        const x = padL + (i / Math.max(1, n - 1)) * plotW;
        const y = (h - padB) - ((v - bounds.lo) / span) * (h - padT - padB);
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    if (hoverIdx >= 0 && hoverIdx < n) {
      const x = padL + (hoverIdx / Math.max(1, n - 1)) * plotW;
      ctx.strokeStyle = "rgba(230, 232, 235, 0.55)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, h - padB);
      ctx.stroke();
      ctx.setLineDash([]);

      for (let si = 0; si < metric.series.length; si++) {
        const v = lines[si][hoverIdx];
        if (v == null || v !== v) continue;
        const y = (h - padB) - ((v - bounds.lo) / span) * (h - padT - padB);
        ctx.fillStyle = metric.series[si].color;
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#15181c";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function onChartMove(ev) {
    const c = $("chart");
    const rect = c.getBoundingClientRect();
    const idx = indexFromCanvasX(ev.clientX - rect.left, rect.width);
    if (idx < 0) {
      if (hoverIdx !== -1) {
        hoverIdx = -1;
        drawChart();
      }
      hideTip();
      return;
    }
    const moved = idx !== hoverIdx;
    hoverIdx = idx;
    if (moved) drawChart();
    showTip(resolveMetric(), idx, ev.clientX, ev.clientY);
  }

  function onChartLeave() {
    hoverIdx = -1;
    hideTip();
    drawChart();
  }

  async function refreshLive() {
    const live = await getJson(API + "?api=live&compress=0");
    renderKpis(live);
    renderNeigh(live.neighbors || []);
  }

  async function refreshSeries() {
    const data = await getJson(API + "?api=series&seconds=" + windowSec + "&compress=0");
    series = data.samples || [];
    if (hoverIdx >= series.length) {
      hoverIdx = series.length ? series.length - 1 : -1;
      if (hoverIdx < 0) hideTip();
    }
    drawChart();
  }

  async function tick() {
    try {
      await refreshLive();
      await refreshSeries();
      setErr(null);
    } catch (e) {
      setErr("API error: " + e.message + " (is babel-monitord running?)");
    }
  }

  function bindTabGroup(id, onPick) {
    $(id).addEventListener("click", function (ev) {
      const b = ev.target.closest("button");
      if (!b || !$(id).contains(b)) return;
      [].forEach.call($(id).querySelectorAll("button"), function (x) {
        x.classList.toggle("active", x === b);
      });
      onPick(b);
    });
  }

  bindTabGroup("metricTabs", function (b) {
    metricId = b.getAttribute("data-metric") || "lq";
    hoverIdx = -1;
    hideTip();
    drawChart();
  });

  bindTabGroup("timeTabs", function (b) {
    windowSec = parseInt(b.getAttribute("data-sec"), 10);
    hoverIdx = -1;
    hideTip();
    refreshSeries().catch(function (e) { setErr(e.message); });
  });

  (function bindChartHover() {
    const c = $("chart");
    c.addEventListener("mousemove", onChartMove);
    c.addEventListener("mouseleave", onChartLeave);
  })();

  tick();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>
