<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>babel-monitor</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #23282f;
    --fg: #e6e8eb;
    --muted: #9aa3ad;
    --line: #3a424d;
    --accent: #5b9fd4;
    --ok: #6fbf73;
    --bad: #d97b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: baseline;
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 14px 18px 28px; max-width: 1100px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 110px;
  }
  .kpi .v { font-size: 1.25rem; font-weight: 600; }
  .kpi .l { color: var(--muted); font-size: 11px; margin-top: 2px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 14px;
  }
  section h2 { margin: 0 0 10px; font-size: 0.95rem; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .tabs button.active { color: var(--fg); border-color: var(--accent); }
  canvas { width: 100%; height: 160px; display: block; background: #15181c; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .err { color: var(--bad); padding: 12px 18px; }
  .okdot { color: var(--ok); }
  .baddot { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>babel-monitor</h1>
  <div class="meta" id="identity">connecting…</div>
</header>
<div class="err" id="err" hidden></div>
<main>
  <div class="row" id="kpis"></div>
  <section>
    <h2>History</h2>
    <div class="tabs" id="tabs">
      <button data-sec="300" class="active">5m</button>
      <button data-sec="1800">30m</button>
      <button data-sec="86400">24h</button>
    </div>
    <canvas id="chart" width="1000" height="160"></canvas>
  </section>
  <section>
    <h2>Neighbors (live)</h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>IPv6</th><th>Iface</th><th>LQ</th><th>Cost</th><th>Rx</th><th>Tx</th></tr>
        </thead>
        <tbody id="neigh"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(function () {
  const API = "/cgi-bin/babel-monitor";
  let windowSec = 300;
  let series = [];

  function $(id) { return document.getElementById(id); }

  async function getJson(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  function setErr(msg) {
    const el = $("err");
    if (!msg) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = msg;
  }

  function renderKpis(live) {
    const m = live.meta || {};
    const s = live.latest || {};
    $("identity").textContent =
      (m.hostname || "?") + " · " + (m.node_id || "?") +
      " · boot " + (m.boot_id || "?") +
      " · " + (m.package_version || "");
    const items = [
      ["Neighbors", s.neighbor_count ?? "—"],
      ["Routable", s.routable_count ?? "—"],
      ["Mean LQ", s.mean_lq != null ? s.mean_lq + "%" : "—"],
      ["Mean cost", s.mean_cost ?? "—"],
      ["TX Δ", s.tx_packets_delta ?? "—"],
      ["Retry Δ", s.tx_retries_delta ?? "—"],
      ["Fail Δ", s.tx_fail_delta ?? "—"],
      ["Hosts", s.host_count ?? "—"],
      ["Samples", (m.sample_count ?? 0) + "/" + (m.sample_cap ?? 0)],
      ["LQM", s.lqm_ok ? "ok" : "—"],
      ["Babel", s.babel_ok ? "ok" : "—"]
    ];
    $("kpis").innerHTML = items.map(function (it) {
      return '<div class="kpi"><div class="v">' + it[1] + '</div><div class="l">' + it[0] + '</div></div>';
    }).join("");
  }

  function renderNeigh(list) {
    const tb = $("neigh");
    if (!list || !list.length) {
      tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">No neighbors</td></tr>';
      return;
    }
    tb.innerHTML = list.map(function (n) {
      return "<tr><td>" + n.ipv6 + "</td><td>" + n.iface + "</td><td>" + n.lq +
        "%</td><td>" + n.cost + "</td><td>" + n.rxcost + "</td><td>" + n.txcost + "</td></tr>";
    }).join("");
  }

  function drawChart() {
    const c = $("chart");
    const ctx = c.getContext("2d");
    const w = c.width, h = c.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#3a424d";
    ctx.beginPath();
    ctx.moveTo(40, 10); ctx.lineTo(40, h - 20); ctx.lineTo(w - 10, h - 20);
    ctx.stroke();
    if (!series.length) {
      ctx.fillStyle = "#9aa3ad";
      ctx.fillText("No samples in window", 50, h / 2);
      return;
    }
    const vals = series.map(function (s) { return s.mean_lq || 0; });
    const max = Math.max(100, Math.max.apply(null, vals));
    ctx.strokeStyle = "#5b9fd4";
    ctx.beginPath();
    for (let i = 0; i < series.length; i++) {
      const x = 40 + (i / Math.max(1, series.length - 1)) * (w - 55);
      const y = (h - 20) - (vals[i] / max) * (h - 35);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = "#9aa3ad";
    ctx.fillText("mean LQ %", 48, 18);
  }

  async function refreshLive() {
    const live = await getJson(API + "?api=live&compress=0");
    renderKpis(live);
    renderNeigh(live.neighbors || []);
  }

  async function refreshSeries() {
    const data = await getJson(API + "?api=series&seconds=" + windowSec + "&compress=0");
    series = data.samples || [];
    drawChart();
  }

  async function tick() {
    try {
      await refreshLive();
      await refreshSeries();
      setErr(null);
    } catch (e) {
      setErr("API error: " + e.message + " (is babel-monitord running?)");
    }
  }

  document.getElementById("tabs").addEventListener("click", function (ev) {
    const b = ev.target.closest("button");
    if (!b) return;
    [].forEach.call(document.querySelectorAll("#tabs button"), function (x) {
      x.classList.toggle("active", x === b);
    });
    windowSec = parseInt(b.getAttribute("data-sec"), 10);
    refreshSeries().catch(function (e) { setErr(e.message); });
  });

  tick();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>
